services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      retries: 10
  app:
    # Gotowy obraz (docker compose pull) albo budowa z kodu (docker compose up -d --build):
    image: ghcr.io/silvergunx/routeros-monitor:${APP_CHANNEL:-stable}
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      CADDY_ADMIN: http://caddy:2019
      SYSLOG_PORT: ${SYSLOG_PORT:-514}
    ports:
      - "${SYSLOG_PORT:-514}:5514/udp"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Europe/Warsaw}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --resume
    depends_on:
      - app
volumes:
  dbdata:
  caddydata:
  caddyconfig:
