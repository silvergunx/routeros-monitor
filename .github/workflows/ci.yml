name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Translation files
        run: python tools/check_locales.py
      - name: Python syntax
        run: python -m compileall -q app
      - name: Unit tests
        run: python tests/test_version.py && python tests/test_speed.py && python tests/test_netguard.py
      - name: Docker image builds
        run: docker build --build-arg OOKLA_VERSION= -t rm-test ./app
      - name: LibreSpeed CLI is in the image
        run: docker run --rm rm-test librespeed-cli --version
      - name: Python can import the speed engines
        run: docker run --rm rm-test python -c "import speedengines, version; print(version.current())"
