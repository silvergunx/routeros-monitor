name: Publish image

# develop            -> ghcr.io/<owner>/routeros-monitor:beta
# tag v1.2.0         -> :1.2.0 and :stable
# tag v1.3.0-beta.1  -> :1.3.0-beta.1 and :beta
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the VERSION file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [ "v$(tr -d '[:space:]' < app/VERSION)" = "$GITHUB_REF_NAME" ] || { echo "VERSION ($(cat app/VERSION)) does not match tag $GITHUB_REF_NAME"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/develop' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-')) }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The public image does not bundle Ookla's Speedtest CLI (its licence forbids redistribution).
          build-args: |
            OOKLA_VERSION=
          cache-from: type=gha
          cache-to: type=gha,mode=max
